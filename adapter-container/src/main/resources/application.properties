spring.application.name=library-api

# Porta: padrão 8080. Para mudar, defina a variável de ambiente SERVER_PORT (o Spring a reconhece sozinho).
server.shutdown=graceful

# Não expor detalhes internos nas respostas de erro padrão do Spring.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
