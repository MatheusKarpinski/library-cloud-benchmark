# PostgreSQL LOCAL para desenvolvimento. Não é o banco dos experimentos no Azure.
# As variáveis vêm do arquivo .env (copie de .env.example). A senha NÃO tem valor padrão
# de propósito: sem .env, o comando falha em vez de subir um banco com senha conhecida.
services:
  postgres:
    image: postgres:17
    container_name: library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"   # acessível só a partir desta máquina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
